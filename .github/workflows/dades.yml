name: Actualizar datos del CEBC

on:
  schedule:
    - cron: '7,27,47 * * * *'   # cada 20 minutos
  workflow_dispatch: {}          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: dades
  cancel-in-progress: false

jobs:
  dades:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, mbstring

      - name: Recuperar lo último publicado (por si algo falla hoy)
        run: |
          mkdir -p out
          git fetch --depth=1 origin dades 2>/dev/null || true
          for f in agenda basquet; do
            git show "origin/dades:$f.json" > "out/$f.json" 2>/dev/null || rm -f "out/$f.json"
          done

      - name: Descargar datos
        run: |
          php run.php agenda  || echo "agenda: sin cambios"
          php run.php basquet || echo "basquet: sin cambios"

      - name: Publicar en la rama "dades"
        run: |
          test -n "$(ls out/*.json 2>/dev/null)" || { echo "Nada que publicar"; exit 1; }
          rm -rf /tmp/pub && mkdir /tmp/pub && cp out/*.json /tmp/pub/
          cd /tmp/pub
          git init -q -b dades
          git config user.name "dades-bot"
          git config user.email "dades-bot@users.noreply.github.com"
          git add .
          git commit -q -m "Datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" dades
